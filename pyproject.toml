[project]
name = "alpha"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KMK-MAENG", email = "kmk2737ab@naver.com" }
]
requires-python = ">=3.14"
dependencies = [
    "exchange-calendars>=4.13.2",
    "gplearn>=0.4.3",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-binance>=1.0.37",
    "python-dotenv>=1.2.2",
    "xgboost>=3.4.1",
    "yfinance>=1.7.0",
]

[project.scripts]
alpha = "alpha:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
